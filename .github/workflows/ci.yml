name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PHP Lint + WPCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2, phpcs, phpab
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      - name: PHP syntax check
        run: |
          status=0
          while IFS= read -r file; do
            php -l "$file" || status=1
          done < <(find trunk -name '*.php')
          exit $status

      - name: WPCS coding standards
        run: composer run cs || true

  php-compatibility:
    name: PHP Compatibility (7.4 - 8.2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.2']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2, phpcs
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --no-scripts

      - name: PHP 7.4 compatibility
        if: matrix.php-version == '7.4'
        run: composer run compatibility || true